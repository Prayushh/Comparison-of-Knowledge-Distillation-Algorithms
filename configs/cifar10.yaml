experiment:
  name: "cifar10_experiment"
  dataset: "CIFAR10"
  num_classes: 10

seed: 42

device: "cuda"

dataset:
  root: "./data"
  image_size: 32
  num_workers: 4
  pin_memory: true

dataloader:
  batch_size: 128
  val_size: 5000

training:
  epochs: 200
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: "cosine"
  t_max: 200

checkpoint:
  save_dir: "./checkpoints"
  save_best_only: true

logging:
  log_dir: "./results"
  print_frequency: 50

evaluation:
  topk: [1, 5]
